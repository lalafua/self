# ---------- 基础 ----------
set -g default-shell /usr/sbin/fish
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"   # 真彩色
set -g mouse on
set -g history-limit 50000
set -g renumber-windows on         # 关闭窗口后自动重排编号
set -sg escape-time 10             # 降低 Esc 延迟，对 vim 很重要
set -g focus-events on
set -g set-clipboard on
set -g display-time 2000

# 重新加载配置
bind r source-file ~/.config/tmux/tmux.conf \; display "config reloaded"

# ---------- 分屏 / 窗口（保持当前目录） ----------
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# vim 风格切换 pane
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# 调整 pane 大小（可连按）
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Alt+数字 / Alt+h,l 免前缀切换窗口
bind -n M-h previous-window
bind -n M-l next-window

# ---------- vim 复制模式 ----------
setw -g mode-keys vi
set -g status-keys vi
bind Escape copy-mode               # prefix + Esc 进入复制模式
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "clip.exe"   # WSL：复制到 Windows 剪贴板
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "clip.exe"
bind p paste-buffer

